name: Kitco Auto Bot

on:
  schedule:
    # Dushanba 10:00 AM va Juma 09:00 PM (Dammam / UTC+3 vaqti bo'yicha)
    - cron: '0 7 * * 1'   # Dushanba 07:00 UTC (= 10:00 AM Dammam)
    - cron: '0 18 * * 5'  # Juma 18:00 UTC (= 09:00 PM Dammam)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py
